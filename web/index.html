<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
  <title>天机 — 中国传统玄学计算 | Tianji</title>
  <meta name="description" content="Pure offline Chinese metaphysics calculator — BaZi, Liu Yao, Zi Wei Dou Shu. Privacy-first, no data collection.">
  <link rel="stylesheet" href="css/style.css?v=20260817-vi7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☯</text></svg>">
</head>
<body>
  <!-- Background particle canvas -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Skip link for accessibility -->
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <!-- Header -->
  <header class="app-header" role="banner">
    <div class="container">
      <div class="header-left">
        <h1 class="logo">☯ <span data-i18n="appTitle">天机</span></h1>
        <p class="subtitle" data-i18n="appSubtitle">中国传统玄学计算</p>
      </div>
      <div class="header-right">
        <button id="lang-toggle" class="btn btn-ghost" title="Switch Language" aria-label="Switch Language">中/EN</button>
        <button id="theme-toggle" class="btn btn-ghost" title="Toggle Theme" aria-label="Toggle Theme">🌙</button>
        <button id="share-btn" class="btn btn-ghost" data-i18n="share" aria-label="分享">分享</button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero" aria-label="天机介绍">
    <div class="hero-taiji" aria-hidden="true">☯</div>
    <h2 class="hero-title" data-i18n="appTitle">天机</h2>
    <p class="hero-subtitle" data-i18n="appSubtitle">中国传统玄学计算</p>
    <button id="hero-cta-btn" class="hero-cta" data-i18n="quickStart" aria-label="快速开始">
      快速开始
    </button>
  </section>

  <!-- Decorative Divider -->
  <div class="divider-ornament" aria-hidden="true">易 · 道 · 术</div>

  <!-- Tab Navigation (Desktop) -->
  <nav class="tab-nav" role="tablist" aria-label="功能选项">
    <div class="container">
      <button id="tab-bazi" class="tab active" role="tab" aria-selected="true" aria-controls="panel-bazi" data-panel="panel-bazi" data-i18n="tabBazi">八字排盘</button>
      <button id="tab-liuyao" class="tab" role="tab" aria-selected="false" aria-controls="panel-liuyao" data-panel="panel-liuyao" data-i18n="tabLiuyao">六爻占卜</button>
      <button id="tab-ziwei" class="tab" role="tab" aria-selected="false" aria-controls="panel-ziwei" data-panel="panel-ziwei" data-i18n="tabZiwei">紫微斗数</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="main-content" class="container">

    <!-- BaZi Panel -->
    <section id="panel-bazi" class="tab-panel active" role="tabpanel" aria-labelledby="tab-bazi">
      <div class="card animate-spring">
        <div class="card-header">
          <h2 data-i18n="tabBazi">八字排盘</h2>
        </div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label for="bazi-date" data-i18n="birthDate">出生日期</label>
              <input type="date" id="bazi-date" value="1990-05-15">
            </div>
            <div class="form-group">
              <label for="bazi-hour" data-i18n="birthTime">出生时辰</label>
              <select id="bazi-hour">
                <option value="0" data-i18n="shiChen0">Giờ Tý (23:00–01:00)</option>
                <option value="1" data-i18n="shiChen1">Giờ Sửu (01:00–03:00)</option>
                <option value="2" data-i18n="shiChen2">Giờ Dần (03:00–05:00)</option>
                <option value="3" data-i18n="shiChen3">Giờ Mão (05:00–07:00)</option>
                <option value="4" data-i18n="shiChen4">Giờ Thìn (07:00–09:00)</option>
                <option value="5" data-i18n="shiChen5">Giờ Tỵ (09:00–11:00)</option>
                <option value="6" data-i18n="shiChen6">Giờ Ngọ (11:00–13:00)</option>
                <option value="7" selected data-i18n="shiChen7">Giờ Mùi (13:00–15:00)</option>
                <option value="8" data-i18n="shiChen8">Giờ Thân (15:00–17:00)</option>
                <option value="9" data-i18n="shiChen9">Giờ Dậu (17:00–19:00)</option>
                <option value="10" data-i18n="shiChen10">Giờ Tuất (19:00–21:00)</option>
                <option value="11" data-i18n="shiChen11">Giờ Hợi (21:00–23:00)</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="gender">性别</label>
              <div class="radio-group" role="radiogroup" aria-label="性别">
                <label><input type="radio" name="bazi-gender" id="bazi-gender-male" value="male" checked> <span data-i18n="male">男</span></label>
                <label><input type="radio" name="bazi-gender" id="bazi-gender-female" value="female"> <span data-i18n="female">女</span></label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="bazi-result" class="stagger" aria-live="polite">
        <canvas id="five-elements-chart" width="300" height="300" aria-label="五行力量雷达图"></canvas>
      </div>
    </section>

    <!-- Liu Yao Panel -->
    <section id="panel-liuyao" class="tab-panel" role="tabpanel" aria-labelledby="tab-liuyao" hidden>
      <div class="card animate-spring">
        <div class="card-header">
          <h2 data-i18n="tabLiuyao">六爻占卜</h2>
        </div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label for="liuyao-method" data-i18n="castMethod">起卦方法</label>
              <select id="liuyao-method">
                <option value="time" data-i18n="timeCast">时间起卦</option>
                <option value="number" data-i18n="numberCast">数字起卦</option>
                <option value="coin" data-i18n="coinCast">铜钱摇卦</option>
              </select>
            </div>
            <div class="form-group">
              <label for="liuyao-topic">Chủ đề luận giải</label>
              <select id="liuyao-topic">
                <option value="general">Tổng quan</option>
                <option value="career">Công việc</option>
                <option value="finance">Tài chính</option>
                <option value="relationship">Tình cảm</option>
                <option value="health">Sức khỏe</option>
                <option value="study">Học tập</option>
              </select>
            </div>
          </div>
          <div id="liuyao-number-inputs" class="form-row" style="display:none;">
            <div class="form-group">
              <label for="liuyao-num1" data-i18n="num1Label">Số thứ nhất</label>
              <input type="number" id="liuyao-num1" min="1" max="999" value="3">
            </div>
            <div class="form-group">
              <label for="liuyao-num2" data-i18n="num2Label">Số thứ hai</label>
              <input type="number" id="liuyao-num2" min="1" max="999" value="7">
            </div>
            <div class="form-group">
              <label for="liuyao-num3" data-i18n="num3Label">Số thứ ba (tùy chọn)</label>
              <input type="number" id="liuyao-num3" min="1" max="999" placeholder="Tùy chọn">
            </div>
          </div>
          <button id="liuyao-cast-btn" class="btn btn-primary" data-i18n="castNow">
            <span class="taiji-spinner" style="display:none;" aria-hidden="true">☯</span>
            <span data-i18n="castNow">Gieo quẻ</span>
          </button>
        </div>
      </div>
      <div id="liuyao-result" class="stagger" aria-live="polite"></div>
    </section>

    <!-- Zi Wei Panel -->
    <section id="panel-ziwei" class="tab-panel" role="tabpanel" aria-labelledby="tab-ziwei" hidden>
      <div class="card animate-spring">
        <div class="card-header">
          <h2 data-i18n="tabZiwei">紫微斗数</h2>
        </div>
        <div class="card-body">
          <p class="form-hint" data-i18n="lunarHint">请输入农历（阴历）出生日期</p>
          <div class="form-row">
            <div class="form-group">
              <label for="ziwei-year" data-i18n="lunarYear">年</label>
              <input type="number" id="ziwei-year" min="1900" max="2100" value="1990">
            </div>
            <div class="form-group">
              <label for="ziwei-month" data-i18n="lunarMonth">月</label>
              <select id="ziwei-month">
                <option value="1" data-i18n="lunarMonth1">Tháng Giêng</option>
                <option value="2" data-i18n="lunarMonth2">Tháng Hai</option>
                <option value="3" data-i18n="lunarMonth3">Tháng Ba</option>
                <option value="4" selected data-i18n="lunarMonth4">Tháng Tư</option>
                <option value="5" data-i18n="lunarMonth5">Tháng Năm</option>
                <option value="6" data-i18n="lunarMonth6">Tháng Sáu</option>
                <option value="7" data-i18n="lunarMonth7">Tháng Bảy</option>
                <option value="8" data-i18n="lunarMonth8">Tháng Tám</option>
                <option value="9" data-i18n="lunarMonth9">Tháng Chín</option>
                <option value="10" data-i18n="lunarMonth10">Tháng Mười</option>
                <option value="11" data-i18n="lunarMonth11">Tháng Một âm lịch</option>
                <option value="12" data-i18n="lunarMonth12">Tháng Chạp</option>
              </select>
            </div>
            <div class="form-group">
              <label for="ziwei-day" data-i18n="lunarDay">日</label>
              <input type="number" id="ziwei-day" min="1" max="30" value="21">
            </div>
            <div class="form-group">
              <label for="ziwei-hour" data-i18n="birthTime">时辰</label>
              <select id="ziwei-hour">
                <option value="0" data-i18n="shiChen0">Giờ Tý</option>
                <option value="1" data-i18n="shiChen1">Giờ Sửu</option>
                <option value="2" data-i18n="shiChen2">Giờ Dần</option>
                <option value="3" data-i18n="shiChen3">Giờ Mão</option>
                <option value="4" data-i18n="shiChen4">Giờ Thìn</option>
                <option value="5" data-i18n="shiChen5">Giờ Tỵ</option>
                <option value="6" data-i18n="shiChen6">Giờ Ngọ</option>
                <option value="7" selected data-i18n="shiChen7">Giờ Mùi</option>
                <option value="8" data-i18n="shiChen8">Giờ Thân</option>
                <option value="9" data-i18n="shiChen9">Giờ Dậu</option>
                <option value="10" data-i18n="shiChen10">Giờ Tuất</option>
                <option value="11" data-i18n="shiChen11">Giờ Hợi</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="gender">性别</label>
              <div class="radio-group" role="radiogroup" aria-label="性别">
                <label><input type="radio" name="ziwei-gender" id="ziwei-gender-male" value="male" checked> <span data-i18n="male">男</span></label>
                <label><input type="radio" name="ziwei-gender" id="ziwei-gender-female" value="female"> <span data-i18n="female">女</span></label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="ziwei-result" aria-live="polite"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="app-footer" role="contentinfo">
    <div class="container">
      <div class="privacy-notice">
        <h3>🔒 <span data-i18n="privacy">隐私声明</span></h3>
        <p data-i18n="privacyText">本工具完全在浏览器本地运行，不收集任何个人数据，不发送任何网络请求。您的出生信息仅用于本地计算，不会被存储或传输。</p>
      </div>
      <hr class="divider-pattern" aria-hidden="true">
      <p class="footer-brand">☯ 天机 (Tianji) v0.3.0 — MIT License</p>
      <p class="footer-links">
        <a href="https://github.com/Zijian-Ni/tianji" target="_blank" rel="noopener">GitHub</a> ·
        <a href="https://github.com/Zijian-Ni/tianji/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">贡献指南</a>
      </p>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav" role="tablist" aria-label="底部导航">
    <ul class="bottom-nav-items">
      <li>
        <button class="bottom-nav-item active" data-tab="bazi" role="tab" aria-selected="true" aria-controls="panel-bazi">
          <span class="nav-icon" aria-hidden="true">卦</span>
          <span data-i18n="tabBazi">八字</span>
        </button>
      </li>
      <li>
        <button class="bottom-nav-item" data-tab="liuyao" role="tab" aria-selected="false" aria-controls="panel-liuyao">
          <span class="nav-icon" aria-hidden="true">爻</span>
          <span data-i18n="tabLiuyao">六爻</span>
        </button>
      </li>
      <li>
        <button class="bottom-nav-item" data-tab="ziwei" role="tab" aria-selected="false" aria-controls="panel-ziwei">
          <span class="nav-icon" aria-hidden="true">星</span>
          <span data-i18n="tabZiwei">紫微</span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- Share Modal -->
  <div id="share-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="分享" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="share">分享</h3>
        <button class="modal-close" aria-label="关闭" onclick="document.getElementById('share-modal').style.display='none'">✕</button>
      </div>
      <div class="modal-body">
        <div class="share-url">
          <input type="text" id="share-url" readonly aria-label="分享链接">
          <button id="copy-url-btn" class="btn btn-primary btn-sm" data-i18n="copyLink">复制链接</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- Scripts (loaded in order) -->
  <script src="js/calendar.js?v=20260817-vi4"></script>
  <script src="js/bazi.js?v=20260817-vi4"></script>
  <script src="js/liuyao.js?v=20260831-vi7"></script>
  <script src="js/ziwei.js?v=20260817-vi4"></script>
  <script src="js/i18n.js?v=20260819-vi10"></script>
  <script src="js/app.js?v=20260831-vi20"></script>
</body>
</html>
